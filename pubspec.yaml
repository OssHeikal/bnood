name: bnood
description: Bnood بنود — local client fund tracking for site engineers.
publish_to: "none"
version: 1.0.0+5

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.0
  uuid: ^4.5.1
  intl: ^0.20.2
  image_picker: ^1.1.2
  image_picker_android: ^0.8.13
  share_plus: ^10.1.4
  pdf: ^3.11.1
  collection: ^1.19.0
  url_launcher: ^6.3.1
  package_info_plus: ^8.3.0
  flutter_widget_from_html_core: ^0.16.0
  flutter_svg: ^2.0.17
  vector_graphics: ^1.2.6
  shared_preferences: ^2.5.3
  flutter_native_contact_picker: ^0.0.12
  flutter_secure_storage: ^9.2.4
  dio: ^5.11.1
  infinite_scroll_pagination: ^5.1.1
  pin_code_fields: ^9.4.0
  image_picker_platform_interface: ^2.11.2
  image: 4.5.4
  bot_toast: ^4.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.22.1
  build_runner: ^2.4.13
  flutter_gen: ^5.15.0
  flutter_gen_runner: ^5.15.0

flutter_gen:
  output: lib/core/resources/gen/
  line_length: 120
  integrations:
    flutter_svg: true
  assets:
    enabled: true

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icons/
    - assets/item-icons/
    - assets/brand/
    - assets/fonts/Cairo-Regular.ttf
    - assets/fonts/Cairo-Bold.ttf
    - assets/fonts/OFL.txt
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
